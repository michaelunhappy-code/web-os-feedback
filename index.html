<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web OS 反馈中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%; max-width: 560px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { font-size: 20px; margin-bottom: 8px; color: #58a6ff; }
        .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; font-weight: 600; }
        select, textarea, input {
            width: 100%; padding: 10px 12px;
            background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #c9d1d9; font-size: 14px;
            outline: none; transition: border-color 0.2s;
        }
        select:focus, textarea:focus, input:focus { border-color: #58a6ff; }
        textarea { resize: vertical; min-height: 120px; font-family: inherit; }
        .btn {
            width: 100%; padding: 12px;
            background: #238636; color: white;
            border: none; border-radius: 6px;
            font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: #2ea043; }
        .note {
            margin-top: 16px; padding: 12px;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);
            border-radius: 6px; font-size: 12px; color: #8b949e;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Web OS 反馈中心</h1>
        <div class="subtitle">遇到问题或有新想法？告诉我们</div>
        
        <form id="feedbackForm">
            <div class="form-group">
                <label>反馈类型</label>
                <select id="type">
                    <option value="bug">🐛 Bug 报告</option>
                    <option value="feature">💡 功能建议</option>
                    <option value="other">📝 其他</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="title" placeholder="简短描述" required>
            </div>
            
            <div class="form-group">
                <label>详细描述</label>
                <textarea id="body" placeholder="请详细描述问题或建议..." required></textarea>
            </div>
            
            <div class="form-group">
                <label>联系方式（可选）</label>
                <input type="text" id="contact" placeholder="邮箱 / QQ / 微信">
            </div>
            
            <button type="submit" class="btn">提交到 GitHub Issues</button>
        </form>
        
        <div class="note">
            💡 点击提交后会跳转到 GitHub 进行确认。如果你没有 GitHub 账号，可以发邮件至 <a href="mailto:cuimoqi@example.com" style="color:#58a6ff">your-email@example.com</a>
        </div>
    </div>

    <script>
        const REPO = '你的用户名/web-os-feedback'; // ← 改成你的
        
        document.getElementById('feedbackForm').onsubmit = function(e) {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const title = document.getElementById('title').value;
            const body = document.getElementById('body').value;
            const contact = document.getElementById('contact').value;
            
            const templates = { bug: 'bug_report.yml', feature: 'feature_request.yml', other: 'feature_request.yml' };
            const labels = { bug: 'bug', feature: 'enhancement', other: 'question' };
            
            const fullBody = `**用户描述**: ${body}%0A%0A**联系方式**: ${contact || '未提供'}%0A%0A---%0A*此 Issue 通过反馈门户创建*`;
            
            const url = `https://github.com/${REPO}/issues/new?template=${templates[type]}&title=${encodeURIComponent(title)}&body=${fullBody}&labels=${labels[type]}`;
            window.open(url, '_blank');
        };
    </script>
</body>
</html>
